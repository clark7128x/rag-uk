corpus:
  dir: data/corpus
  glob: ["*.md", "*.txt"]

index:
  cache_dir: .cache

chunking:
  target_chars: 900
  overlap_chars: 150
  min_chars: 120
  hard_max_chars: 1400
  prefix_section: true

retrieval:
  mode: hybrid            # bm25 | vector | hybrid | hybrid_rerank
  top_k: 5
  candidate_k: 30
  rrf_k: 60
  bm25:
    k1: 1.5
    b: 0.75
  vector:
    model: e5-base
    batch_size: 32
    device: cpu
    models:
      e5-base:
        repo: intfloat/multilingual-e5-base
        query_prefix: "query: "
        passage_prefix: "passage: "
      minilm-l12:
        repo: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        query_prefix: ""
        passage_prefix: ""
  reranker:
    model: BAAI/bge-reranker-v2-m3
    batch_size: 8
    device: cpu

llm:
  base_url: ""            # перекривається LLM_API_BASE
  model: null             # перекривається LLM_MODEL
  temperature: 0.0
  max_output_tokens: 700
  timeout_s: 60
  max_retries: 3
  retry_base_delay_s: 1.0
  retry_max_delay_s: 20.0
  price_per_1m_input: null
  price_per_1m_output: null

eval:
  dataset: data/eval.jsonl
  k_values: [1, 3, 5]
  modes: [bm25, vector, hybrid, hybrid_rerank]
  embedding_models: [e5-base, minilm-l12]
  generation: true
  results_dir: results
  call_log: results/calls.jsonl
