[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-uk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
vector = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["rag_uk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
